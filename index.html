<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kageina</title>
  <link rel="icon" type="image/png" href="assets/img/icon.png">
  <meta name="description" content="Mes liens">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <img id="bg" class="bg" alt="">
  <div class="overlay"></div>

  <main class="wrapper">
    <section class="top">
      <div class="profile glass">
        <img id="avatar" class="avatar" alt="Avatar">
        <h1 id="name" class="name"></h1>
        <p id="bio" class="bio"></p>
        <div id="socials" class="socials"></div>
      </div>

      <div class="glass links-box">
        <div id="links" class="links"></div>
      </div>
    </section>
    <div id="discord-card" class="discord-card glass hidden"></div>

    <!-- Playlist locale : visible si mode = "local" -->
    <section id="playlist-box" class="playlist glass">
      <div class="pl-header">
        <img id="pl-icon" class="pl-icon" alt="">
        <div class="pl-title">
          <span class="pl-label">Ma playlist</span>
          <span id="now-title" class="now-title">—</span>
        </div>
        <div class="pl-controls">
          <button id="prev" class="ctrl" aria-label="Précédent">⏮</button>
          <button id="play" class="ctrl big" aria-label="Lecture">▶</button>
          <button id="next" class="ctrl" aria-label="Suivant">⏭</button>
        </div>
      </div>
      <ol id="tracks" class="tracks"></ol>
    </section>

    <!-- Embed Spotify : visible si mode = "spotify" -->
    <section id="spotify-box" class="spotify-box glass hidden">
      <iframe id="spotify-frame" width="100%" height="352" frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"></iframe>
    </section>

    <p id="footer" class="footer"></p>
  </main>

  <audio id="music" preload="auto"></audio>

  <script src="js/script.js"></script>
</body>
</html>
