name: Mise à jour Steam

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les jeux Steam
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          mkdir -p assets/data
          curl -s "https://api.steampowered.com/IPlayerService/GetOwnedGames/v1/?key=${STEAM_API_KEY}&steamid=76561199177114819&include_appinfo=1&include_played_free_games=1&format=json" -o assets/data/steam.json

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/data/steam.json
          git commit -m "Mise à jour Steam" || echo "Aucun changement"
          git push